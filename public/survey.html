let STATE = {
  page: 'intro',   // 'intro' | 'form' | 'done' | 'admin_login' | 'admin'
  name: '',
  answers: {},     // { qId: string | string[] | {row:col} }
  errors: {},
  submitting: false,

  adminFilter: '',
  adminView: 'overview', // 'overview' | 'detail'
  adminSelected: null,
  adminNotice: null,
};

// ─── UTILS ───────────────────────────────────────────────────────────────────
function getAnswerText(ans) {
  if (!ans) return '';
  if (typeof ans === 'string') return ans;
  if (Array.isArray(ans)) return ans.join(', ');
  if (typeof ans === 'object') return Object.entries(ans).map(([r,c]) => `${r}: ${c}`).join(' | ');
  return '';
}

function isAnswered(q) {
  const ans = STATE.answers[q.id];
  if (!ans) return false;
  if (typeof ans === 'string') return ans.trim().length > 0;
  if (Array.isArray(ans)) return ans.length > 0;
  if (typeof ans === 'object') return (q.matrixRows||[]).every(r => !!ans[r]);
  return false;
}

function answeredCount() { return QUESTIONS.filter(q => isAnswered(q)).length; }
function progress() { return Math.round(answeredCount() / QUESTIONS.length * 100); }

function groupedSections() {
  const map = {};
  QUESTIONS.forEach(q => {
    if (!map[q.section]) map[q.section] = { label: q.sectionLabel, questions: [] };
    map[q.section].questions.push(q);
  });
  return map;
}

function showNotice(text, type='success') {
  STATE.adminNotice = { text, type };
  render();
  setTimeout(() => { STATE.adminNotice = null; render(); }, 3500);
}

// ─── DOWNLOAD JSON ───────────────────────────────────────────────────────────
function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function downloadCSV(responses) {
  if (!responses.length) return;
  const headers = ['Tên','Thời gian',...QUESTIONS.map(q=>`[${q.num}] ${q.label}`)];
  const rows = responses.map(r => [
    r.respondent_name,
    new Date(r.submitted_at).toLocaleString('vi-VN'),
    ...QUESTIONS.map(q => getAnswerText(r.answers[q.id]))
  ]);
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [headers,...rows].map(row => row.map(esc).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `hacoled-survey-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ─── SUBMIT ──────────────────────────────────────────────────────────────────
function handleSubmit() {
  const newErrors = {};
  QUESTIONS.forEach(q => {
    if (q.required && !isAnswered(q)) newErrors[q.id] = 'Câu này cần điền để mình hiểu bạn hơn nhé!';
  });
  if (Object.keys(newErrors).length > 0) {
    STATE.errors = newErrors;
    render();
    const firstId = Object.keys(newErrors)[0];
    document.getElementById('q-'+firstId)?.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  STATE.submitting = true;
  render();
  const response = {
    response_id: `RESP-${Date.now()}-${Math.random().toString(36).slice(2,6).toUpperCase()}`,
    respondent_name: STATE.name.trim(),
    submitted_at: new Date().toISOString(),
    answers: STATE.answers,
  };
  setTimeout(() => {
    // Tải file JSON xuống máy
    downloadJSON(response, `survey-${STATE.name.trim().replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.json`);
    STATE.submitting = false;
    STATE.page = 'done';
    render();
    window.scrollTo({ top:0, behavior:'smooth' });
  }, 600);
}

// ─── ADMIN: load file JSON ────────────────────────────────────────────────────
function handleFileUpload(files) {
  const promises = Array.from(files).map(file => {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) resolve(data);
          else if (data.response_id) resolve([data]);
          else resolve([]);
        } catch { resolve([]); }
      };
      reader.readAsText(file);
    });
  });
  Promise.all(promises).then(results => {
    const all = results.flat();
    // Merge, không trùng response_id
    const existing = STATE.adminResponses;
    const merged = [...existing];
    let added = 0;
    all.forEach(r => {
      if (!merged.find(e => e.response_id === r.response_id)) {
        merged.push(r);
        added++;
      }
    });
    STATE.adminResponses = merged;
    showNotice(`Đã tải ${added} phiếu mới (tổng: ${merged.length}).`);
  });
}

function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('border-zinc-900','bg-zinc-50');
  handleFileUpload(e.dataTransfer.files);
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function renderTextShort(q) {
  const val = STATE.answers[q.id] || '';
  const hasErr = !!STATE.errors[q.id];
  const hasVal = val.trim().length > 0;
  return `<input id="input-${q.id}" type="text" value="${escHtml(val)}"
    oninput="STATE.answers['${q.id}']=this.value;if(STATE.errors['${q.id}'])delete STATE.errors['${q.id}'];updateQ('${q.id}')"
    placeholder="${escHtml(q.placeholder||'')}"
    class="w-full px-4 py-3 rounded-xl border text-sm focus:outline-none focus:ring-2 transition-all ${hasErr ? 'border-rose-300 bg-rose-50/30 focus:ring-rose-300' : hasVal ? 'border-emerald-300 bg-emerald-50/20 focus:ring-emerald-400' : 'border-zinc-200 bg-zinc-50/50 focus:ring-zinc-900 focus:border-zinc-900'}" />`;
}

function renderTextLong(q) {
  const val = STATE.answers[q.id] || '';
  const hasErr = !!STATE.errors[q.id];
  const hasVal = val.trim().length > 0;
  return `<textarea id="input-${q.id}" rows="4"
    oninput="STATE.answers['${q.id}']=this.value;if(STATE.errors['${q.id}'])delete STATE.errors['${q.id}'];updateQ('${q.id}')"
    placeholder="${escHtml(q.placeholder||'')}"
    class="w-full px-4 py-3 rounded-xl border text-sm focus:outline-none focus:ring-2 transition-all leading-relaxed ${hasErr ? 'border-rose-300 bg-rose-50/30 focus:ring-rose-300' : hasVal ? 'border-emerald-300 bg-emerald-50/20 focus:ring-emerald-400' : 'border-zinc-200 bg-zinc-50/50 focus:ring-zinc-900 focus:border-zinc-900'}">${escHtml(val)}</textarea>
    ${hasVal ? `<p class="mt-1 text-right text-[11px] text-zinc-400">${val.length} ký tự</p>` : ''}`;
}

  return (q.options||[]).map(opt => {
    const sel = val === opt;
    return `<label class="flex items-center gap-3 px-4 py-3 rounded-xl border cursor-pointer transition-all ${sel ? 'border-zinc-900 bg-zinc-50 shadow-sm' : 'border-zinc-200 bg-white hover:border-zinc-400 hover:bg-zinc-50/50'}">
      <input type="radio" name="${q.id}" value="${escHtml(opt)}" ${sel?'checked':''} onchange="STATE.answers['${q.id}']=this.value;if(STATE.errors['${q.id}'])delete STATE.errors['${q.id}'];render()" class="sr-only"/>
      <span class="flex-shrink-0 w-4 h-4 rounded-full border-2 flex items-center justify-center transition-all ${sel ? 'border-zinc-950 bg-zinc-950' : 'border-zinc-400 bg-white'}">
        ${sel ? '<span class="w-1.5 h-1.5 rounded-full bg-white"></span>' : ''}
      </span>
      <span class="text-sm text-zinc-800 font-medium">${escHtml(opt)}</span>
    </label>`;
  }).join('');
}

function renderSelectMulti(q) {
  const vals = STATE.answers[q.id] || [];
  const maxSel = q.maxSelect || 99;
  const hasOther = vals.some(v => v.startsWith('__other__:'));
  const otherText = hasOther ? (vals.find(v => v.startsWith('__other__:')) || '').replace('__other__:','') : '';
  const selectedCount = vals.length;

  const opts = (q.options||[]).map(opt => {
    const isOtherOpt = opt === 'Khác (ghi rõ ở ô bên dưới)' || opt === 'Khác';
    const isChecked = isOtherOpt ? hasOther : vals.includes(opt);
    const isDisabled = !isChecked && selectedCount >= maxSel;
    return `<label class="flex items-center gap-3 px-4 py-3 rounded-xl border cursor-pointer transition-all ${isDisabled ? 'opacity-40 cursor-not-allowed border-zinc-200 bg-zinc-50' : isChecked ? 'border-zinc-900 bg-zinc-50 shadow-sm' : 'border-zinc-200 bg-white hover:border-zinc-400 hover:bg-zinc-50/50'}">
      <input type="checkbox" ${isChecked?'checked':''} ${isDisabled?'disabled':''} onchange="toggleMulti('${q.id}','${escHtml(opt)}',${maxSel})" class="sr-only"/>
      <span class="flex-shrink-0 w-4 h-4 rounded border-2 flex items-center justify-center transition-all ${isChecked ? 'border-zinc-950 bg-zinc-950' : 'border-zinc-400 bg-white'}">
        ${isChecked ? '<svg class="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 10 8"><path d="M1 4l2.5 2.5L9 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
      </span>
      <span class="text-sm text-zinc-800 font-medium">${escHtml(opt)}</span>
    </label>`;
  }).join('');

  const otherBox = hasOther ? `<div class="mt-3"><textarea rows="2" placeholder="${escHtml(q.placeholder||'Ghi rõ ở đây...')}"
    oninput="updateOtherText('${q.id}',this.value)"
    class="w-full px-4 py-3 rounded-xl border border-zinc-300 text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 bg-white transition-all">${escHtml(otherText)}</textarea></div>` : '';

  return `<div>
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs text-zinc-500">Chọn tối đa ${maxSel} lựa chọn</span>
      <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${selectedCount > 0 ? 'bg-zinc-900 text-white' : 'bg-zinc-100 text-zinc-500'}">Đã chọn ${selectedCount}/${maxSel}</span>
    </div>
    <div class="space-y-2">${opts}</div>
    ${otherBox}
  </div>`;
}

function renderMatrix(q) {
  const val = STATE.answers[q.id] || {};
  const rows = q.matrixRows || [];
  const cols = q.matrixCols || [];
  const answeredC = Object.keys(val).length;
  const done = answeredC === rows.length;

  const tableRows = rows.map(row => {
    const cells = cols.map(col => {
      const isSel = val[row] === col.key;
      return `<td class="py-3 px-2 text-center">
        <button type="button" onclick="selectMatrix('${q.id}','${escHtml(row)}','${col.key}')"
          class="w-8 h-8 rounded-lg border-2 font-bold text-xs transition-all ${isSel ? 'border-zinc-950 bg-zinc-950 text-white shadow' : 'border-zinc-300 bg-white text-zinc-600 hover:border-zinc-600 hover:bg-zinc-50'}">
          ${col.key}
        </button>
      </td>`;
    }).join('');
    return `<tr class="${val[row] ? 'bg-emerald-50/30' : 'bg-white hover:bg-zinc-50/50'}">
      <td class="py-3 px-4 text-xs font-medium text-zinc-800 leading-snug">${escHtml(row)}</td>${cells}
    </tr>`;
  }).join('');

  const colHeaders = cols.map(col => `<th class="text-center py-3 px-2 font-medium text-zinc-600 text-xs">
    <span class="font-bold text-zinc-950">${col.key}</span><br/>
    <span class="text-[10px] font-normal text-zinc-500 whitespace-nowrap">${col.label.split(' — ')[1]||col.label}</span>
  </th>`).join('');

  return `<div>
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs text-zinc-500">Chọn một mức cho mỗi công việc</span>
      <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${done ? 'bg-emerald-600 text-white' : 'bg-zinc-100 text-zinc-500'}">${answeredC}/${rows.length} đã chọn</span>
    </div>
    <div class="overflow-x-auto rounded-xl border border-zinc-200">
      <table class="w-full text-sm border-collapse">
        <thead><tr class="bg-zinc-50 border-b border-zinc-200"><th class="text-left py-3 px-4 font-medium text-zinc-600 text-xs w-2/5">Công việc</th>${colHeaders}</tr></thead>
        <tbody class="divide-y divide-zinc-100">${tableRows}</tbody>
      </table>
    </div>
  </div>`;
}

function toggleMulti(qId, opt, maxSel) {
  let vals = [...(STATE.answers[qId] || [])];
  const isOtherOpt = opt === 'Khác (ghi rõ ở ô bên dưới)' || opt === 'Khác';
  if (isOtherOpt) {
    const hasOther = vals.some(v => v.startsWith('__other__:'));
    if (hasOther) vals = vals.filter(v => !v.startsWith('__other__:'));
    else { if (vals.length >= maxSel) return; vals.push('__other__:'); }
  } else {
    if (vals.includes(opt)) vals = vals.filter(v => v !== opt);
    else { if (vals.length >= maxSel) return; vals.push(opt); }
  }
  STATE.answers[qId] = vals;
  if (STATE.errors[qId]) delete STATE.errors[qId];
  render();
}

function updateOtherText(qId, text) {
  let vals = [...(STATE.answers[qId] || [])];
  vals = vals.filter(v => !v.startsWith('__other__:'));
  vals.push(`__other__:${text}`);
  STATE.answers[qId] = vals;
}

function selectMatrix(qId, row, col) {
  const val = { ...(STATE.answers[qId] || {}), [row]: col };
  STATE.answers[qId] = val;
  if (STATE.errors[qId]) {
    const q = QUESTIONS.find(q => q.id === qId);
    if (q && (q.matrixRows||[]).every(r => !!val[r])) delete STATE.errors[qId];
  }
  render();
}

function updateQ(qId) { render(); }

          </div>
          ${list.length === 0 ? '<div class="px-5 py-4 text-sm text-zinc-400 italic">Chưa có ai trả lời câu này.</div>' :
            `<div class="divide-y divide-zinc-50">${list.map(a=>`
              <div class="px-5 py-3.5 flex gap-3 items-start">
                <div class="shrink-0 h-6 w-6 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[10px] font-bold mt-0.5">${avatar(a.name)}</div>
                <div class="flex-1 min-w-0">
                  <p class="text-[11px] font-semibold text-zinc-500 mb-0.5">${escHtml(a.name)}</p>
                  <p class="text-sm text-zinc-800 leading-relaxed break-words line-clamp-3">${escHtml(a.ans)}</p>
                </div>
              </div>`).join('')}</div>`}
        </div>`;
      }).join('')}
    </div>
  </div>` : '';

  // Response list
  const listHtml = `
  <div>
    <div class="flex items-center justify-between mb-4 gap-4">
      <h2 class="text-base font-bold text-zinc-900 flex items-center gap-2"><span class="inline-block w-1 h-4 rounded bg-zinc-900"></span>Xem theo người (${filtered.length})</h2>
      <input type="search" value="${escHtml(STATE.adminFilter)}" oninput="STATE.adminFilter=this.value;render()" placeholder="Tìm tên..."
        class="w-40 sm:w-52 px-3 py-2 rounded-lg border border-zinc-300 text-xs focus:outline-none focus:ring-2 focus:ring-zinc-900 bg-white"/>
    </div>
    ${sorted.length === 0 ? `<div class="text-center py-16 text-zinc-400 text-sm">${total===0 ? 'Chưa có file nào được tải lên.' : 'Không tìm thấy kết quả.'}</div>` : ''}
    <div class="space-y-3">
      ${sorted.map(r => {
        const cnt = QUESTIONS.filter(q => getAnswerText(r.answers[q.id])?.trim()).length;
        const pct = Math.round(cnt/QUESTIONS.length*100);
        return `<div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-4 flex items-center gap-4">
          <div class="shrink-0 h-10 w-10 rounded-full bg-zinc-900 text-white flex items-center justify-center font-bold text-sm">${avatar(r.respondent_name)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-0.5">
              <p class="font-semibold text-sm text-zinc-950 truncate">${escHtml(r.respondent_name)}</p>
              <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full ${pct===100?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${pct}%</span>
            </div>
            <p class="text-xs text-zinc-400">${new Date(r.submitted_at).toLocaleString('vi-VN')} · ${cnt}/${QUESTIONS.length} câu</p>
          </div>
          <div class="shrink-0 flex items-center gap-2">
            <button onclick="viewDetail('${r.response_id}')" class="px-3 py-1.5 rounded-lg bg-zinc-900 text-white text-xs font-semibold hover:bg-zinc-700 transition-colors">Xem</button>
            <button onclick="deleteResponse('${r.response_id}','${escHtml(r.respondent_name)}')" class="px-3 py-1.5 rounded-lg border border-zinc-200 text-zinc-500 text-xs font-medium hover:border-rose-300 hover:text-rose-600 hover:bg-rose-50 transition-colors">Xóa</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  const notice = STATE.adminNotice ? `
  <div class="fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${STATE.adminNotice.type==='success'?'bg-emerald-600':'bg-rose-600'}">
    ${escHtml(STATE.adminNotice.text)}
  </div>` : '';

  return `
  ${notice}
  <div class="min-h-screen bg-zinc-50/80">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-zinc-200">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded-lg bg-zinc-950 text-white flex items-center justify-center font-mono font-bold text-xs shadow-sm">HL</div>
          <span class="font-semibold text-sm text-zinc-950">Kết quả Khảo sát Team</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-zinc-100 border border-zinc-200 text-[11px] font-mono font-semibold text-zinc-700">${total} phản hồi</span>
        </div>
        <div class="flex items-center gap-2">
          ${total>0 ? `
          <button onclick="downloadCSV(STATE.adminResponses)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-zinc-300 bg-white text-xs font-medium text-zinc-700 hover:bg-zinc-50 transition-colors">↓ CSV</button>
          <button onclick="downloadJSON(STATE.adminResponses,'hacoled-survey-all-${new Date().toISOString().slice(0,10)}.json')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-zinc-300 bg-white text-xs font-medium text-zinc-700 hover:bg-zinc-50 transition-colors">↓ JSON</button>` : ''}
          <button onclick="STATE.page='intro';render()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-zinc-300 bg-white text-xs font-medium text-zinc-700 hover:bg-zinc-50 transition-colors">← Trang khảo sát</button>
        </div>
      </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
      ${dropzone}
      ${statsHtml}
      ${aggHtml}
      ${listHtml}
    </main>
  </div>`;
}

function pageAdminDetail(r) {
  const notice = STATE.adminNotice ? `<div class="fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${STATE.adminNotice.type==='success'?'bg-emerald-600':'bg-rose-600'}">${escHtml(STATE.adminNotice.text)}</div>` : '';
  return `
  ${notice}
  <div class="min-h-screen bg-zinc-50/80">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-zinc-200">
      <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-3">
        <div class="h-7 w-7 rounded-lg bg-zinc-950 text-white flex items-center justify-center font-mono font-bold text-xs">HL</div>
        <span class="font-semibold text-sm text-zinc-950">Chi tiết phiếu</span>
      </div>
    </header>
    <main class="max-w-3xl mx-auto px-4 py-8">
      <button onclick="STATE.adminView='overview';STATE.adminSelected=null;render()" class="inline-flex items-center gap-1.5 text-sm text-zinc-500 hover:text-zinc-900 mb-6 transition-colors">← Quay lại danh sách</button>
      <div class="bg-white rounded-2xl border border-zinc-200 shadow-sm overflow-hidden">
        <div class="px-6 py-5 border-b border-zinc-100 flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <div class="h-9 w-9 rounded-full bg-zinc-900 text-white flex items-center justify-center font-bold text-sm">${avatar(r.respondent_name)}</div>
              <h2 class="text-lg font-bold text-zinc-950">${escHtml(r.respondent_name)}</h2>
            </div>
            <p class="text-xs text-zinc-400 font-mono ml-11">${escHtml(r.response_id)} · ${new Date(r.submitted_at).toLocaleString('vi-VN')}</p>
          </div>
          <button onclick="deleteResponse('${r.response_id}','${escHtml(r.respondent_name)}')" class="shrink-0 px-3 py-1.5 rounded-lg border border-rose-200 text-rose-600 text-xs font-medium hover:bg-rose-50 transition-colors">Xóa</button>
        </div>
        <div class="divide-y divide-zinc-100">
          ${QUESTIONS.map((q,idx) => {
            const ans = r.answers[q.id];
            const ansText = getAnswerText(ans);
            return `<div class="px-6 py-5">
              <div class="flex items-baseline gap-2 mb-2">
                <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-zinc-100 text-zinc-600 text-[10px] font-bold shrink-0">${idx+1}</span>
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wide">${q.required?'Bắt buộc':'Tùy chọn'}</p>
              </div>
              <p class="text-sm font-semibold text-zinc-800 mb-2 leading-snug">${escHtml(q.label)}</p>
              ${ansText?.trim() ? `<div class="bg-zinc-50 rounded-xl border border-zinc-200 p-4"><p class="text-sm text-zinc-800 leading-relaxed whitespace-pre-wrap">${escHtml(ansText)}</p><p class="text-right text-[11px] text-zinc-400 mt-2">${ansText.length} ký tự</p></div>`
              : '<div class="bg-zinc-50 rounded-xl border border-dashed border-zinc-300 px-4 py-3"><p class="text-sm text-zinc-400 italic">Không trả lời</p></div>'}
            </div>`;
          }).join('')}
        </div>
      </div>
    </main>
  </div>`;
}

function viewDetail(responseId) {
  const r = STATE.adminResponses.find(r => r.response_id === responseId);
  if (!r) return;
  STATE.adminSelected = r;
  STATE.adminView = 'detail';
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function deleteResponse(responseId, name) {
  if (!confirm(`Xóa câu trả lời của "${name}"? Không thể khôi phục.`)) return;
  STATE.adminResponses = STATE.adminResponses.filter(r => r.response_id !== responseId);
  if (STATE.adminSelected?.response_id === responseId) {
    STATE.adminSelected = null;
    STATE.adminView = 'overview';
  }
  showNotice(`Đã xóa câu trả lời của "${name}".`);
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render() {
  let html = '';
  if (STATE.page === 'intro') html = pageIntro();
  else if (STATE.page === 'form') html = pageForm();
  else if (STATE.page === 'done') html = pageDone();
  else if (STATE.page === 'admin_login') html = pageAdminLogin();
  else if (STATE.page === 'admin') html = pageAdmin();
  document.getElementById('app').innerHTML = html;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // ?admin trong URL → vào trang admin
  if (window.location.search.includes('admin') || window.location.hash === '#admin') {
    STATE.page = 'admin_login';
  }
  render();
});
</script>

<div id="app"></div>

<!-- Admin link ẩn ở dưới -->
<div style="position:fixed;bottom:12px;right:14px;z-index:999">
  <a href="?admin" style="font-size:10px;color:#d4d4d8;text-decoration:none;font-family:monospace;">admin</a>
</div>

</body>
</html>
